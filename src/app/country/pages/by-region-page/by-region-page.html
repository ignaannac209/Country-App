<h1 class="text-2xl"> Por Región </h1>
<h3 class="text-lg"> Selecciona una región </h3>

<section class="row mt-2">
  <div class="flex-col">
    @for (region of regions; track region) {
      <button class="btn mr-2 btn-outline w-100px"
      (click)="selectRegion(region)"
      [class.btn-primary]="selectedRegion() === region">
        {{ region }}
      </button>
    }
  </div>
</section>

<country-list
[countries]="countryResources.value() ?? []"
[errorMessage]="countryResources.error() ?? null"
[isLoading]="countryResources.isLoading()"
[isEmpty]="countryResources.value()?.length === 0"
/>
